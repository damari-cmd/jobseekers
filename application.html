<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>
<body>
    <h1>Job Application</h1>
    <div>
        <h2>Job Details</h2>
        <p><strong>Title:</strong> <span id="jobTitle"></span></p>
        <p><strong>Company:</strong> <span id="jobCompany"></span></p>
        <p><strong>Location:</strong> <span id="jobLocation"></span></p>
        <p><strong>Salary:</strong> <span id="jobSalary"></span></p>
    </div>
    <a href="dashboard.html">Back to Dashboard</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('jobTitle').textContent = urlParams.get('title');
        document.getElementById('jobCompany').textContent = urlParams.get('company');
        document.getElementById('jobLocation').textContent = urlParams.get('location');
        document.getElementById('jobSalary').textContent = urlParams.get('salary');
    </script>
</body>
</html>
