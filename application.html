<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application | JobBridge</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .back-link:hover { text-decoration: underline; }

        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.75rem;
        }

        .job-details {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            border-left: 4px solid var(--primary);
        }

        .job-details h2 {
            margin: 0 0 1rem;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .job-details p {
            margin: 6px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .job-details .detail-label {
            font-weight: 600;
        }

        form {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        form h2 {
            margin: 0 0 1.25rem;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-secondary:hover { background: #cbd5e1; }

        .success-msg {
            display: none;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-link">&#8592; Back to Jobs</a>

        <h1>Job Application</h1>

        <div class="job-details">
            <h2>Position Details</h2>
            <p><span class="detail-label">Title:</span> <span id="jobTitle">-</span></p>
            <p><span class="detail-label">Company:</span> <span id="jobCompany">-</span></p>
            <p><span class="detail-label">Location:</span> <span id="jobLocation">-</span></p>
            <p><span class="detail-label">Salary:</span> <span id="jobSalary">-</span></p>
            <p><span class="detail-label">Description:</span> <span id="jobDescription">-</span></p>
        </div>

        <form id="applicationForm" novalidate>
            <h2>Your Application</h2>

            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" placeholder="Jane Smith" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-group">
                <label for="resume">Resume / CV *</label>
                <textarea id="resume" name="resume" placeholder="Paste your resume text or provide a link to your CV" required></textarea>
            </div>

            <div class="form-group">
                <label for="coverLetter">Cover Letter</label>
                <textarea id="coverLetter" name="coverLetter" placeholder="Tell us why you're a great fit for this role"></textarea>
            </div>

            <div class="form-group">
                <label for="experience">Years of Experience *</label>
                <input type="number" id="experience" name="experience" min="0" step="1" placeholder="3" required>
            </div>

            <div class="form-group">
                <label for="message">Additional Information</label>
                <textarea id="message" name="message" placeholder="Anything else you'd like us to know"></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Submit Application</button>
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">Back</button>
            </div>

            <div class="success-msg" id="successMsg">
                Your application has been submitted successfully!
            </div>
        </form>
    </div>

    <script>
        // Populate job details from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('jobId');

        document.getElementById('jobTitle').textContent = urlParams.get('title') || '-';
        document.getElementById('jobCompany').textContent = urlParams.get('company') || '-';
        document.getElementById('jobLocation').textContent = urlParams.get('location') || '-';
        document.getElementById('jobSalary').textContent = urlParams.get('salary') || '-';
        document.getElementById('jobDescription').textContent = urlParams.get('description') || '-';

        // Handle form submission
        document.getElementById('applicationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const resume = document.getElementById('resume').value.trim();
            const experience = document.getElementById('experience').value;
            const experienceNum = parseInt(experience, 10);

            if (!fullName || !email || !phone || !resume || experience === '' || isNaN(experienceNum) || experienceNum < 0) {
                alert('Please fill in all required fields.');
                return;
            }

            const applicationData = {
                job_id: jobId,
                full_name: fullName,
                email: email,
                phone: phone,
                resume: resume,
                cover_letter: document.getElementById('coverLetter').value.trim(),
                experience: experienceNum,
                message: document.getElementById('message').value.trim(),
                submitted_at: new Date().toISOString()
            };

            try {
                // Save to Supabase 'applications' table when configured
                // const { error } = await supabase.from('applications').insert([applicationData]);
                // if (error) throw error;

                document.getElementById('successMsg').style.display = 'block';
                e.target.reset();
                document.getElementById('successMsg').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (err) {
                alert('Error submitting application: ' + err.message);
            }
        });
    </script>
</body>
</html>
