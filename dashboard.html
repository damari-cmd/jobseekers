<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | JobBridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="search-header">
        <div class="search-container">
            <input type="text" id="job-search" placeholder="Search for jobs or companies...">
            <button class="connect-btn search-btn" onclick="filterJobs()">Search</button>
        </div>
    </header>

    <main>
        <div id="jobs-grid" class="jobs-grid">
            <!-- Job cards are rendered dynamically by script.js -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
